<ion-card class="product-card" button="true" [routerLink]="['/item', item().id]">
  <div class="image-container" [style.background]="'rgba(var(--ion-color-' + categoryColorVar() + '-rgb), 0.14)'">
    <ion-icon [name]="categoryIcon()" [style.color]="'var(--ion-color-' + categoryColorVar() + ')'"></ion-icon>
    <ion-badge
      [color]="item().status === 'Disponible' ? 'success' : 'medium'"
      class="status-badge"
    >
      {{ item().status }}
    </ion-badge>
  </div>
  <ion-card-header>
    <ion-card-title>{{ item().title }}</ion-card-title>
    <ion-card-subtitle>{{ item().distance }} · {{ item().ownerName }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <span class="rating">⭐ {{ item().rating }}</span>
    <span class="guarantee-price">${{ item().guaranteePrice / 1000 }}k garantía</span>
  </ion-card-content>
</ion-card>
