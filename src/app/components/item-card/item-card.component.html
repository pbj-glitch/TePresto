<ion-card class="product-card">
  <div class="image-container">
    <div class="image-placeholder" [class.show]="imageError()">
      <ion-icon name="pricetag-outline"></ion-icon>
    </div>
    <img
      [src]="item().imageUrl"
      [alt]="item().title"
      [class.hidden]="imageError()"
      (error)="onImageError()"
    />
    <ion-badge
      [color]="item().status === 'Disponible' ? 'success' : 'medium'"
      class="status-badge"
    >
      {{ item().status }}
    </ion-badge>
  </div>
  <ion-card-header>
    <ion-card-title>{{ item().title }}</ion-card-title>
    <ion-card-subtitle>{{ item().distance }} · {{ item().ownerName }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <span class="rating">⭐ {{ item().rating }}</span>
    <span class="guarantee-price">${{ item().guaranteePrice / 1000 }}k garantía</span>
  </ion-card-content>
</ion-card>
