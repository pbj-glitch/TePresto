<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-wrapper">
    <h1 class="auth-title">Recuperar contraseña</h1>
    <p class="auth-subtitle">Te enviaremos un enlace a tu correo</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <ion-item>
        <ion-input
          label="Correo"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          autocomplete="email"
        ></ion-input>
      </ion-item>

      @if (errorMessage()) {
        <ion-text color="danger">
          <p class="auth-error">{{ errorMessage() }}</p>
        </ion-text>
      }

      @if (successMessage()) {
        <ion-text color="success">
          <p class="auth-error">{{ successMessage() }}</p>
        </ion-text>
      }

      <ion-button expand="block" type="submit" class="auth-submit" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <ion-spinner name="dots"></ion-spinner>
        } @else {
          Enviar enlace
        }
      </ion-button>
    </form>

    <p class="auth-switch">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </p>
  </div>
</ion-content>
