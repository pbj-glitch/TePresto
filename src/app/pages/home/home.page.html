<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    <ion-title color="primary" class="ion-text-center"><b>TePresto</b> 🤝</ion-title>
  </ion-toolbar>
  <ion-toolbar color="light">
    <ion-searchbar placeholder="Buscar en tu comunidad..."></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Grilla Dinámica con los datos del Servicio -->
  <ion-grid>
    <ion-row>
      @for (item of items(); track item.id) {
        <ion-col size="6" sizeMd="4" sizeLg="3" sizeXl="2">
          <app-item-card [item]="item" />
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- Banner para solicitar necesidades -->
  <ion-card class="need-banner">
    <ion-card-header>
      <ion-card-title>¿No encuentras lo que buscas?</ion-card-title>
      <ion-card-subtitle>Envía una solicitud a tus vecinos</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-button expand="block" fill="solid" color="primary" routerLink="/tabs/add-post">
        Publicar necesidad
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
